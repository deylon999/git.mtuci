server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx defaults to 1m; the API accepts up to 50 MB per file (submissions, course files).
  client_max_body_size 100m;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # User avatars (stored as site-relative /uploads/avatars/... URLs).
  location /uploads/avatars/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # WebSockets (/ws/notifications, /ws/activity): the frontend connects to its own origin.
  location /ws/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't append: the API trusts this header, so clients must not seed it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't append: the API trusts this header, so clients must not seed it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
