services:
  gitea-init:
    image: curlimages/curl:latest
    container_name: mtuci-gitea-init
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USERNAME=gitea_admin
      - GITEA_ADMIN_PASSWORD=admin12345
    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Gitea..."
        sleep 10
        echo "Creating API token..."
        TOKEN=$$(curl -s -X POST "$${GITEA_URL}/api/v1/users/$${GITEA_ADMIN_USERNAME}/tokens" \
          -u "$${GITEA_ADMIN_USERNAME}:$${GITEA_ADMIN_PASSWORD}" \
          -H "Content-Type: application/json" \
          -d '{"name":"mtuci-api-token"}' | grep -o '"sha1":"[^"]*' | cut -d'"' -f4)
        if [ -n "$$TOKEN" ]; then
          echo "Token created: $$TOKEN"
          echo "GITEA_TOKEN=$$TOKEN" > /shared/gitea-token.env
        else
          echo "Token creation failed, trying to get existing..."
          curl -s "$${GITEA_URL}/api/v1/users/$${GITEA_ADMIN_USERNAME}/tokens" \
            -u "$${GITEA_ADMIN_USERNAME}:$${GITEA_ADMIN_PASSWORD}"
        fi
    volumes:
      - gitea_token:/shared
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtuci-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gitea:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/app
      - PYTHONIOENCODING=utf-8
      - LANG=ru_RU.UTF-8
      # Database
      - POSTGRES_USER=mtuci
      - POSTGRES_PASSWORD=mtuci
      - POSTGRES_DB=mtuci_app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # JWT
      - JWT_SECRET_KEY=dev-secret-key-63d3de08-f361-4b2c-be30-f097f498d8f7
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      # Gitea
      - GITEA_URL=http://gitea:3000
      - GITEA_ADMIN_USERNAME=gitea_admin
      - GITEA_ADMIN_PASSWORD=admin12345
      - GITEA_WEBHOOK_SECRET=dev-webhook-secret-2024
      # Admin
      - ADMIN_EMAIL=admin@mtuci.local
      - ADMIN_PASSWORD=admin123
      # Frontend
      - FRONTEND_URL=http://localhost:3001
      # SMTP (optional, for password reset)
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - gitea_token:/shared:ro
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: mtuci-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mtuci
      - POSTGRES_PASSWORD=mtuci
      - POSTGRES_DB=mtuci_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtuci -d mtuci_app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  gitea:
    image: gitea/gitea:1.22.1
    container_name: mtuci-gitea
    ports:
      - "3000:3000"
    volumes:
      - gitea_data:/data
    environment:
      # Автоматическая установка Gitea
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=mtuci_app
      - GITEA__database__USER=mtuci
      - GITEA__database__PASSWD=mtuci
      # Админ пользователь
      - GITEA__admin__DEFAULT_ADMIN_USERNAME=gitea_admin
      - GITEA__admin__DEFAULT_ADMIN_PASSWORD=admin12345
      - GITEA__admin__DEFAULT_ADMIN_EMAIL=admin@gitea.local
      # Сервер настройки
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__DISABLE_SSH=true
      # Разрешение webhook для контейнера api
      - GITEA__webhook__ALLOWED_HOST_LIST=api,172.18.0.0/16,*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtuci-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      # Прокси Vite → контейнер api (браузер ходит на /api, не на localhost:8000 с хоста)
      - VITE_PROXY_API=http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  gitea_data:
  gitea_token:

