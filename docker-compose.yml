services:
  ollama:
    image: ollama/ollama:latest
    container_name: mtuci-ollama
    restart: unless-stopped
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama-model:
    image: ollama/ollama:latest
    container_name: mtuci-ollama-model
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        MODEL="$${OLLAMA_MODEL:-qwen2.5:7b-instruct}"
        echo "[ollama-model] pulling $$MODEL"
        ollama pull "$$MODEL"
        echo "[ollama-model] ready"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtuci-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      gitea-bootstrap:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/app
      - PYTHONIOENCODING=utf-8
      - LANG=ru_RU.UTF-8
      - POSTGRES_USER=mtuci
      - POSTGRES_PASSWORD=mtuci
      - POSTGRES_DB=mtuci_app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - JWT_SECRET_KEY=dev-secret-key-63d3de08-f361-4b2c-be30-f097f498d8f7
      - MTUCI_CREDENTIALS_SECRET=dev-mtuci-credentials-secret-2026
      - GITEA_URL=http://gitea:3000
      - GITEA_PUBLIC_URL=http://localhost:3000
      - GITEA_ADMIN_USERNAME=gitea_admin
      - GITEA_ADMIN_PASSWORD=admin12345
      - ADMIN_EMAIL=admin@mtuci.local
      - ADMIN_PASSWORD=admin123
      - FRONTEND_HEALTH_URL=http://frontend:3001
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_MODEL=qwen2.5:7b-instruct
      - AI_REVIEW_CACHE_TTL_SECONDS=900
      - AI_REVIEW_MODEL_KEEP_ALIVE_SECONDS=1800
      - AI_REVIEW_TIMEOUT_SECONDS=600
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/backups
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:16
    container_name: mtuci-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mtuci
      - POSTGRES_PASSWORD=mtuci
      - POSTGRES_DB=mtuci_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtuci -d mtuci_app"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  gitea-bootstrap:
    image: gitea/gitea:1.22.1
    container_name: mtuci-gitea-bootstrap
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_data:/data
    environment:
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=mtuci_app
      - GITEA__database__USER=mtuci
      - GITEA__database__PASSWD=mtuci
      - GITEA_ADMIN_USERNAME=gitea_admin
      - GITEA_ADMIN_PASSWORD=admin12345
      - GITEA_ADMIN_EMAIL=admin@gitea.local
    user: git
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if gitea admin user list 2>/dev/null | awk 'NR>1 {print $$2}' | grep -qx "$${GITEA_ADMIN_USERNAME:-gitea_admin}"; then
          echo "[gitea-bootstrap] admin already exists"
          exit 0
        fi
        echo "[gitea-bootstrap] creating $${GITEA_ADMIN_USERNAME:-gitea_admin} ..."
        gitea admin user create \
          --username "$${GITEA_ADMIN_USERNAME:-gitea_admin}" \
          --password "$${GITEA_ADMIN_PASSWORD:-admin12345}" \
          --email "$${GITEA_ADMIN_EMAIL:-admin@gitea.local}" \
          --admin --must-change-password=false

  gitea:
    image: gitea/gitea:1.22.1
    container_name: mtuci-gitea
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
    environment:
      # Автоматическая установка Gitea
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=mtuci_app
      - GITEA__database__USER=mtuci
      - GITEA__database__PASSWD=mtuci
      # Админ пользователь
      - GITEA__admin__DEFAULT_ADMIN_USERNAME=gitea_admin
      - GITEA__admin__DEFAULT_ADMIN_PASSWORD=admin12345
      - GITEA__admin__DEFAULT_ADMIN_EMAIL=admin@gitea.local
      # Сервер настройки
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__START_SSH_SERVER=false
      - GITEA__server__SSH_DOMAIN=localhost
      - GITEA__server__SSH_PORT=2222
      # Разрешение webhook для контейнера api
      - GITEA__webhook__ALLOWED_HOST_LIST=api,172.18.0.0/16,*
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtuci-frontend-v2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"

  backup-cron:
    image: postgres:16
    container_name: mtuci-backup-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=mtuci
      - POSTGRES_PASSWORD=mtuci
      - POSTGRES_DB=mtuci_app
      - POSTGRES_HOST=postgres
      - BACKUP_SCHEDULE=0 3 * * *
      - TZ=Europe/Moscow
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Starting backup cron service..."
        while true; do
          current_hour=$$(date +%H)
          current_minute=$$(date +%M)
          
          if [ "$$current_hour" = "03" ] && [ "$$current_minute" = "00" ]; then
            echo "Running scheduled backup at $$(date)"
            /backup.sh
          fi
          
          sleep 30
        done

volumes:
  postgres_data:
  gitea_data:
  ollama_data:

